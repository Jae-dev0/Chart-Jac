name: Bug report
description: Report something that is not working in Jac-Chart
type: Bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This form is for bug reports only. To suggest an improvement, submit or vote on a feature request at [Jac-Chart Feedback](https://feedback.jac-chart.app).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include steps, a recording, or logs if you have them.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your Jac-Chart version and deployment method. Add browser or OS details if relevant.
