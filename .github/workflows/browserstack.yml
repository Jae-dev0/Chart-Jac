name: BrowserStack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browserstack
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JAC_CHART_E2E_HOST: bs-local.com
      JAC_CHART_E2E_TLS: "true"
      COMPOSE_FILE: tests/e2e/compose.yml:tests/e2e/compose.tls.yml
    steps:
      - name: Check BrowserStack credentials
        id: browserstack-credentials
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo '::warning::BrowserStack smoke tests skipped: set BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY in repository Actions secrets to enable them.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.browserstack-credentials.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.browserstack-credentials.outputs.available == 'true'
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.browserstack-credentials.outputs.available == 'true'
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - run: pnpm --dir tests/e2e install --frozen-lockfile --ignore-scripts
        if: steps.browserstack-credentials.outputs.available == 'true'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.browserstack-credentials.outputs.available == 'true'
      - name: Build this revision of Jac-Chart
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        if: steps.browserstack-credentials.outputs.available == 'true'
        with:
          context: .
          file: Dockerfile.jac-chart
          load: true
          tags: jac-chart-browserstack:test
          cache-from: type=gha,scope=browserstack
          cache-to: type=gha,mode=max,scope=browserstack

      - name: Create disposable test certificate
        if: steps.browserstack-credentials.outputs.available == 'true'
        run: |
          mkdir -p .cache/e2e-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .cache/e2e-tls/key.pem -out .cache/e2e-tls/cert.pem \
            -subj '/CN=bs-local.com' -addext 'subjectAltName=DNS:bs-local.com'
      - name: Start disposable test instance
        if: steps.browserstack-credentials.outputs.available == 'true'
        run: docker compose up --no-build --wait --wait-timeout 180
      - name: Run browser smoke tests
        if: steps.browserstack-credentials.outputs.available == 'true'
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: pnpm test:browserstack

      - name: Collect instance logs
        if: failure() && steps.browserstack-credentials.outputs.available == 'true'
        run: |
          mkdir -p .cache/e2e
          docker compose logs --no-color > .cache/e2e/instance.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && steps.browserstack-credentials.outputs.available == 'true'
        with:
          name: browserstack-results
          path: .cache/e2e/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop disposable test instance
        if: always() && steps.browserstack-credentials.outputs.available == 'true'
        run: docker compose down --volumes
