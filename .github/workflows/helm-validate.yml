name: Validate Helm chart

on:
  workflow_call:

env:
  CHART_PATH: charts/jac-chart

jobs:
  validate:
    name: ${{ matrix.name }}
    timeout-minutes: 5
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: >-
              --set jac-chart.env.authSecret=secure-auth-secret-at-least-32-characters
          - name: ingress
            args: >-
              --set ingress.enabled=true
              --set jac-chart.env.authSecret=secure-auth-secret-at-least-32-characters
              --set postgresql.auth.password=secure-db-password
          - name: gateway
            args: >-
              --set gateway.enabled=true
              --set gateway.parentRefs[0].name=gateway
              --set jac-chart.env.authSecret=secure-auth-secret-at-least-32-characters
              --set postgresql.auth.password=secure-db-password
          - name: autoscaling
            args: >-
              --set autoscaling.enabled=true
              --set jac-chart.resources.requests.cpu=100m
              --set jac-chart.env.authSecret=secure-auth-secret-at-least-32-characters
          - name: external-database
            args: >-
              --set postgresql.enabled=false
              --set jac-chart.env.database.external.enabled=true
              --set jac-chart.env.database.external.host=db.example.com
              --set jac-chart.env.database.external.password=secure-db-password
              --set jac-chart.env.authSecret=secure-auth-secret-at-least-32-characters
          - name: bundled-postgresql-secret
            args: >-
              --set postgresql.auth.existingSecret=jac-chart-secrets
              --set jac-chart.env.authSecret=secure-auth-secret-at-least-32-characters

    steps:
      - name: Checkout repository
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Lint chart
        run: helm lint "$CHART_PATH" --set jac-chart.env.clientUrl=https://jac-chart.example.com ${{ matrix.args }}

      - name: Render chart (${{ matrix.name }})
        run: helm template jac-chart "$CHART_PATH" --set jac-chart.env.clientUrl=https://jac-chart.example.com ${{ matrix.args }}

      - name: Check secret preservation and security settings
        if: matrix.name == 'default'
        run: ruby scripts/security/check-helm-secrets.rb
