{{- if not .Values.jac-chart.env.existingSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jac-chart.fullname" . }}-auth
  labels:
    {{- include "jac-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth-secret: {{ .Values.jac-chart.env.authSecret | quote }}
{{- end }}
